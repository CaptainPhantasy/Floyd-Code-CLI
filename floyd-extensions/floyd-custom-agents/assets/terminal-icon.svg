<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Terminal window -->
  <rect x="2" y="4" width="20" height="16" rx="2" fill="#1e1e1e" stroke="#00bcd4"/>
  <!-- Terminal header -->
  <rect x="2" y="4" width="20" height="4" rx="2" fill="#00bcd4" stroke="none"/>
  <!-- Terminal dots -->
  <circle cx="6" cy="6" r="1" fill="white"/>
  <circle cx="9" cy="6" r="1" fill="white"/>
  <circle cx="12" cy="6" r="1" fill="white"/>
  <!-- Terminal prompt -->
  <path d="M5 12h14" stroke="#00bcd4" stroke-width="2"/>
  <path d="M5 16h10" stroke="#00bcd4" stroke-width="2"/>
  <!-- Cursor -->
  <path d="M16 12l3 3" stroke="#00bcd4" stroke-width="2"/>
</svg>