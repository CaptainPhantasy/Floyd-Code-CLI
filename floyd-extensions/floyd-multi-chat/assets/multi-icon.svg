<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main chat bubble -->
  <rect x="2" y="2" width="12" height="14" rx="2" fill="#a855f7" stroke="none"/>
  <!-- Second chat bubble -->
  <rect x="10" y="6" width="12" height="14" rx="2" fill="#a855f7" stroke="none"/>
  <!-- Third chat bubble (offset) -->
  <rect x="6" y="10" width="12" height="14" rx="2" fill="#a855f7" stroke="none"/>
  <!-- Ellipses for multi-panel effect -->
  <circle cx="5" cy="7" r="1" fill="#c4b5fd" stroke="none"/>
  <circle cx="13" cy="11" r="1" fill="#c4b5fd" stroke="none"/>
  <circle cx="9" cy="15" r="1" fill="#c4b5fd" stroke="none"/>
</svg>