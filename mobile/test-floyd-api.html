    ws.onopen = () => {
      console.log('Connected to Floyd Agent API');
      document.getElementById('output').textContent = 'Connected! Click button to test git_status...';

    ws.onmessage = (event) => {
      const response = JSON.parse(event.data);
      document.getElementById('output').textContent = JSON.stringify(response, null, 2);

    ws.onerror = (error) => {
      document.getElementById('output').textContent = 'WebSocket error: ' + error;

    ws.onclose = () => {
      console.log('Disconnected');
    };

    function testGitStatus() {
      ws.send(JSON.stringify({
        id: 'test-' + Date.now(),
        method: 'git_status',
        params: { repoPath: '/Volumes/Storage/FLOYD_CLI/floyd-wrapper-main' }
      }));
